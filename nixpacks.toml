# Railway uses Nixpacks to build this Laravel app.
# Docs: https://nixpacks.com/docs/providers/php

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql",
           "php82Extensions.mbstring", "php82Extensions.xml",
           "php82Extensions.curl", "php82Extensions.zip",
           "php82Extensions.gd", "php82Extensions.fileinfo",
           "php82Extensions.tokenizer", "php82Extensions.ctype",
           "php82Extensions.openssl", "php82Extensions.bcmath",
           "nodePackages.npm"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
  "npm run build"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"
