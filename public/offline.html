<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline — Fiona's Mushroom Farm</title>
    <link rel="stylesheet" href="vendor/fontawesome/6.4.0/css/all.min.css">
    <script>
        try {
            var t = localStorage.getItem('kabutech-theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
    <style>
        :root {
            --bg: linear-gradient(145deg, #050608 0%, #0d0f14 50%, #07080a 100%);
            --card: rgba(18, 20, 28, 0.85);
            --text: #ffffff;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.09);
            --primary: #10b981;
        }
        html[data-theme="light"] {
            --bg: linear-gradient(145deg, #f8faf9 0%, #eef3f0 50%, #f5f8f6 100%);
            --card: rgba(255, 255, 255, 0.95);
            --text: #0f172a;
            --muted: #475569;
            --border: rgba(15, 23, 42, 0.10);
            --primary: #059669;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 50% 30%, rgba(16, 185, 129, 0.12) 0%, transparent 60%), var(--bg);
            background-attachment: fixed;
            color: var(--text);
        }
        .card {
            max-width: 440px;
            width: 100%;
            text-align: center;
            padding: 2.5rem 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        }
        .logo {
            width: 72px; height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(16, 185, 129, 0.4);
            margin-bottom: 1.25rem;
        }
        .icon {
            font-size: 2.25rem;
            color: #ef5350;
            margin-bottom: 0.75rem;
        }
        h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem; }
        p  { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
        button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.7rem 1.6rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }
        button:hover { filter: brightness(1.08); }
        .status { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); }
    </style>
</head>
<body>
    <div class="card">
        <img src="images/mushroom-logo.jpg" alt="Fiona's Mushroom Farm" class="logo">
        <div class="icon"><i class="fas fa-wifi-slash"></i><i class="fas fa-wifi" style="display:none"></i></div>
        <h1>You're offline</h1>
        <p>The monitoring system can't be reached right now. Check your Wi-Fi connection — this page will reload automatically once you're back online.</p>
        <button type="button" onclick="retryConnection()"><i class="fas fa-rotate-right"></i>&nbsp; Try again</button>
        <div class="status" id="status">Checking connection…</div>
    </div>
    <script>
        function retryConnection() {
            var st = document.getElementById('status');
            if (st) st.textContent = 'Reconnecting…';
            // Force-update any cached service worker before reloading
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.update(); }));
                }).finally(function () {
                    location.reload();
                });
            } else {
                location.reload();
            }
        }

        // Reload as soon as the connection returns
        window.addEventListener('online', function () {
            document.getElementById('status').textContent = 'Back online — reloading…';
            setTimeout(retryConnection, 600);
        });
    </script>
</body>
</html>
